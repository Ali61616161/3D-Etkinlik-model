<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d11" />
    <title>Koltuğundan Gör — Volkswagen Arena İstanbul</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0d11'/%3E%3Cpath d='M7 20h18v3H7zM9 9h6v9H9zM17 12h6v6h-6z' fill='%234cc2ff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>

      <header id="topbar">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <div class="brand-text">
            <b>Koltuğundan Gör</b>
            <small>Volkswagen Arena İstanbul</small>
          </div>
        </div>
        <label class="evt"><span class="sr">Etkinlik</span><select id="cfgSelect" aria-label="Etkinlik düzeni"></select></label>
        <button id="btnMenu" class="chip icon" aria-label="Ayarlar" aria-haspopup="true" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </header>

      <div id="menu" role="menu" hidden>
        <h3>Görünüm</h3>
        <button id="btnTint" class="row sw" role="menuitemcheckbox" aria-pressed="false"><span>Kategori renkleri</span><i></i></button>
        <button id="btnCrowd" class="row sw" role="menuitemcheckbox" aria-pressed="false"><span>Seyirci kalabalığı</span><i></i></button>
        <button id="btnFs" class="row" role="menuitem"><span>Tam ekran / sinema modu</span></button>
        <h3>Grafik kalitesi</h3>
        <div id="qList" class="qlist" role="radiogroup" aria-label="Grafik kalitesi"></div>
        <button id="btnAbout" class="row" role="menuitem"><span>Veri kaynakları</span></button>
      </div>

      <aside id="panel" class="open">
        <button id="panelToggle" aria-label="Paneli aç/kapat"><span></span></button>
        <div class="panel-scroll">
          <section class="card" id="infoCard" hidden>
            <div class="info-head">
              <div>
                <div class="big" id="infoTitle"></div>
                <div class="cat"><i id="infoDot"></i><span id="infoCat"></span></div>
              </div>
            </div>
            <dl class="stats" id="infoStats"></dl>
            <p class="evt-note" id="infoNote"></p>
            <button id="btnView" class="primary">Koltuktan göster</button>
          </section>

          <section class="card" id="pickCard">
            <div class="tabs" role="tablist">
              <button role="tab" id="tabPick" aria-selected="true" data-tab="pick">Seç</button>
              <button role="tab" id="tabMap" aria-selected="false" data-tab="map">Plan</button>
            </div>

            <div id="paneSeat" class="pane">
              <div id="seatFields">
                <div class="field"><label for="selBlock" id="lblBlock">Blok</label><select id="selBlock"></select></div>
                <div class="row2">
                  <div class="field"><label for="selRow">Sıra</label><select id="selRow" disabled></select></div>
                  <div class="field"><label for="selSeat">Koltuk</label><select id="selSeat" disabled></select></div>
                </div>
              </div>
              <div id="quick" class="quick"></div>
            </div>

            <div id="paneMap" class="pane" hidden>
              <div class="mini-wrap"><canvas id="mini"></canvas></div>
              <div id="legend" class="legend"></div>
            </div>
          </section>
        </div>
      </aside>

      <div id="hud" hidden>
        <div class="hud-row">
          <button id="hudPrev" aria-label="Önceki koltuk">◀</button>
          <div class="hud-main">
            <b id="hudTitle"></b>
            <small id="hudSub"></small>
          </div>
          <button id="hudNext" aria-label="Sonraki koltuk">▶</button>
        </div>
        <div class="hud-row small">
          <button id="hudFront" aria-label="Bir sıra öne">▲ Öne</button>
          <button id="hudBack" aria-label="Bir sıra arkaya">▼ Arkaya</button>
          <button id="hudReset">⟲ Sahneye bak</button>
          <button id="hudExit" class="accent">Salona dön</button>
        </div>
        <div class="hud-hint">Sürükle: etrafa bak · Tekerlek: yakınlaştır · Ok tuşları: yer değiştir · Esc: çık</div>
      </div>

      <button id="btnImm" class="chip icon imm" aria-label="Sinema modundan çık" title="Arayüzü geri getir" hidden>⤡</button>
      <div id="blockBar" hidden>
        <div class="bb-text"><b id="bbTitle"></b><small id="bbSub"></small></div>
        <button id="bbGo" class="primary">Buradan göster</button>
        <button id="bbClose" aria-label="Seçimi kapat">✕</button>
      </div>
      <div id="tip" hidden></div>
      <div id="toast" hidden></div>

      <div id="loading">
        <div class="spinner"></div>
        <div>Salon oluşturuluyor…</div>
        <small id="loadDetail"></small>
      </div>

      <dialog id="about">
        <form method="dialog">
          <h2>Veri kaynakları ve varsayımlar</h2>
          <div id="aboutBody"></div>
          <button class="primary">Kapat</button>
        </form>
      </dialog>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
